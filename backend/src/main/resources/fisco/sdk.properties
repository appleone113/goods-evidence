# FISCO BCOS v3 SDK 配置【早期参考模板 · 本项目未使用】
# 项目实际读取的是 jar 外的 backend/fisco/config.toml（TOML 格式），
# 请复制 backend/fisco/config.toml.example；本 .properties 仅作参数对照。
# 证书必须用 SDK 默认文件名 ca.crt / sdk.crt / sdk.key，
# 改名成 ssl.crt / ssl.key 会导致 SDK 加载不到证书、发交易报 -4010。
# FISCO BCOS 3.x 群组 ID 是字符串 group0，不是数字 1。

chain.id=chain0
group.id=1

# 节点连接（WeBASE/节点 RPC）
node.network=127.0.0.1:20200

# 证书与密钥路径（classpath 相对路径，指向与 sdk.properties 同目录的文件）
cryptoMaterial.certPath=classpath:fisco/

# SDK 账户（用于发送交易的凭证，链上已授权地址）
account.keyStoreDir=classpath:fisco/accounts
account.accountAddress=
account.accountPassword=

# 线程/超时等默认即可

server:
  port: 8080

# 所有环境相关配置都用 ${环境变量:默认值} 形式，别人下载后可以不改源码、
# 直接设环境变量或启动脚本里的参数覆盖；本地双击启动则用默认值即可。
spring:
  application:
    name: goods-evidence
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/second_hand_chain?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: edu.jxue.goodsevidence.entity
  global-config:
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 文件存储配置 =====
# type=local（默认）：二维码/质检报告/维修凭证落在本机目录，通过 /api/file/** 回读，无需装 MinIO
# type=minio      ：落在 MinIO 对象存储，届时填下方 minio 段并用 minio 地址访问
storage:
  type: local
  local-dir: ./uploads

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: goods-evidence

# ===== 对外访问基址（一物一码二维码内容用）=====
# 默认 localhost 仅供本机调试；局域网/答辩演示时用启动参数或环境变量覆盖：
#   --app.public-base-url=http://<本机局域网IP>:8080
#   或 APP_PUBLIC_BASE_URL=http://<本机局域网IP>:8080
# ⚠️ 改这里只影响「新登记」的商品；历史二维码是已生成的静态 PNG，
#    需调用 POST /api/product/refresh-qr 批量重刷（或重新登记商品）。
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

jwt:
  # 本地演示用默认值即可；公开部署前必须设 JWT_SECRET 环境变量换掉默认串
  secret: ${JWT_SECRET:G3vE7QpL2xR9mT4wY8nB6kH1sD5fJ0aZ}
  expire-seconds: 86400

# ===== 区块链配置 =====
# 默认 false（MockChainServiceImpl）：别人下载后不装 FISCO BCOS 也能完整跑通九个模块
# 要真链：设环境变量 FISCO_ENABLED=true，或启动参数 --fisco.enabled=true
fisco:
  # true = 走真实 FISCO BCOS 链（FiscoChainServiceImpl）；false = 内存模拟（MockChainServiceImpl）
  enabled: ${FISCO_ENABLED:false}
  # ⚠️ FISCO BCOS 3.x 的群组ID是字符串 group0/group1，不是数字 1/2
  group-id: group0
  # ⚠️ 必须指向 jar 外的真实文件：证书在 jar 内 SDK 读不到，且 classpath 资源打 fat jar 后取不到 File
  config-path: ./fisco/config.toml
  contract:
    ownership-address: "0x412d17a4b6a79953bc891106b420bcd4493cd1cd"
    evidence-address: "0x6a1ade97880c62cd64734daa375fdab1dc7a3cca"
